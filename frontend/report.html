<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f2"><title>统计报表 · 小红花</title><script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/management.css"><link rel="stylesheet" href="/report.css"></head>
<body><div class="page-shell">
  <header class="topbar"><a class="brand" href="/" aria-label="小红花首页"><span class="brand-flower">✿</span><span>小红花 <span class="brand-muted">统计报表</span></span></a><nav class="topbar-right page-nav"><a href="/">首页</a><a class="active" href="/management">数据管理</a><a href="/settings">设置</a><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">深色模式</span></button></nav></header>
  <main class="report-main">
    <section class="report-intro"><div><p class="eyebrow"><span>✳</span> 单次统计报表</p><h1 id="report-title">统计报表<span class="title-dot">.</span></h1><p class="subtitle" id="report-subtitle">正在读取统计数据…</p></div><div class="report-actions"><a class="secondary-link" href="/management">返回数据管理</a><a class="primary-link" id="report-entry-link" href="/management">录入 / 修改</a></div></section>
    <div class="report-error hidden" id="report-error"></div>
    <section id="report-content" class="hidden">
      <section class="stats-grid report-stats"><article class="stat-card stat-highlight"><div class="stat-label">已登记小红花</div><div class="stat-number" id="report-total">0</div><div class="stat-foot">朵 · 本次统计</div></article><article class="stat-card"><div class="stat-label">已登记学生</div><div class="stat-number"><span id="report-entered">0</span><small> / <span id="report-size">0</span></small></div><div class="progress-track"><div class="progress-fill" id="report-progress"></div></div><div class="stat-foot">位同学</div></article><article class="stat-card"><div class="stat-label">平均数</div><div class="stat-number" id="report-mean">—</div><div class="stat-foot">朵 / 人</div></article><article class="stat-card"><div class="stat-label">中位数</div><div class="stat-number" id="report-median">—</div><div class="stat-foot">朵</div></article></section>
      <div class="report-grid"><section class="report-charts"><article class="panel report-panel"><div class="section-kicker">01 <span>·</span> 数量分布</div><h2>学生小红花数量分布</h2><p class="report-caption" id="report-mode-caption">众数：—</p><div class="report-svg"><svg id="report-distribution" role="img" aria-label="本次统计学生小红花数量分布"></svg></div><div class="report-empty hidden" id="distribution-empty">登记学生数量后会显示分布。</div></article><article class="panel report-panel"><div class="section-kicker">02 <span>·</span> 月度变化</div><h2>本班历史统计趋势</h2><p class="report-caption">查看本班本次统计月份及之前已创建的统计记录。</p><div class="report-svg"><svg id="report-trend" role="img" aria-label="本班历史月度小红花总数趋势"></svg></div><div class="report-empty hidden" id="report-trend-empty">暂时没有历史统计记录。</div></article></section>
        <section class="panel report-ranking"><div class="section-kicker">03 <span>·</span> 荣誉榜</div><h2>本次统计前十名</h2><div id="report-ranking-list" class="ranking-list"></div><div class="report-empty hidden" id="report-ranking-empty">还没有已登记的学生。</div><a class="export-link" id="report-export" href="#"><span>↓</span> 导出本次统计表 <span class="export-arrow">↗</span></a></section></div>
      <section class="panel report-table-panel"><div class="report-table-heading"><div><div class="section-kicker">04 <span>·</span> 学生明细</div><h2>本班登记情况</h2></div><span id="detail-count" class="record-count"></span></div><div class="report-table-wrap"><table><thead><tr><th>名次</th><th>序号</th><th>姓名</th><th>小红花数量</th><th>登记状态</th></tr></thead><tbody id="report-student-rows"></tbody></table></div></section>
    </section>
  </main>
</div><script src="/charts.js" defer></script><script src="/report.js" defer></script></body></html>
